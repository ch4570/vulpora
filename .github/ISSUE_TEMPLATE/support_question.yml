name: Support question
description: Ask for help with installation, configuration, or usage.
title: "[Support]: "
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched the documentation and open and closed issues.
          required: true
        - label: I removed secrets, personal paths, private hostnames, and proprietary content.
          required: true
        - label: This question does not disclose a security vulnerability.
          required: true

  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: Describe the desired outcome and relevant runtime or capability pack.
    validations:
      required: true

  - type: textarea
    id: attempts
    attributes:
      label: What have you tried?
      description: Include exact commands, relevant documentation, and the sanitized result.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Vulpora version or commit, OS, shell, Node.js, runtime, scope, and installation method.
    validations:
      required: true
