case_id: retrieval-gate/notion-missing-provenance
target:
  kind: retrieval_gate
  id: retrieval-gate-v0

intent: >
  "Notion에서 봤다"는 표지만 있고 page_id, URL, section locator, retrieval timestamp가 없는
  정책 memory는 유사도와 내용의 개연성이 높아도 admit되지 않고 reject되는지 확인한다.

input:
  task:
    summary: Order 기록 보존 정책을 확인한다.
    scope:
      repo: sample-domain
      workspace: example-workspace
    action_risk: medium
  current_evidence:
    - 사용자는 출처가 검증된 사내 정책을 요구했다.

candidate_memories:
  - id: mem-notion-retention-no-provenance-20260714
    type: semantic
    content:
      summary: Notion 정책에 따르면 Order 기록을 120일 보존한다.
    source:
      kind: generated_reflection
      trust: internal
      confidence: medium
      label: notion-derived
      # page_id, uri, section_locator, retrieved_at이 없어 원문을 재검증할 수 없다.
    scope:
      repo: sample-domain
      workspace: example-workspace
    validity:
      status: unverified
      fresh: true

expected:
  decisions:
    mem-notion-retention-no-provenance-20260714: reject
  decision_checks:
    mem-notion-retention-no-provenance-20260714:
      scope_match: pass
      freshness: fresh
      provenance_present: false
  metrics:
    admission_precision: 1.0
  reason: >
    Notion에서 왔다는 label은 provenance가 아니다. page_id, URI, section, retrieval timestamp가
    없어 출처와 최신성을 확인할 수 없으므로 행동 근거로 admit하지 않는다.

failure_signals:
  - notion-derived label만 보고 정책 memory를 admit한다.
  - 출처 없는 120일 값을 현재 정책으로 사용한다.
  - provenance 부재를 unknown으로 보고하지 않는다.

pass_criteria:
  - 결정은 reject다(admit 아님).
  - 결정 사유에 Notion page provenance 부재가 명시된다.
