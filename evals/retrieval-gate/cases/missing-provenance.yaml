case_id: retrieval-gate/missing-provenance
target:
  kind: retrieval_gate
  id: retrieval-gate-v0

intent: >
  scope·trust·freshness가 모두 문제없어 보여도 provenance(출처 근거)가 없는 memory는
  admit되지 않고 reject되는지 확인한다. retrieval-gate의 provenance 체크를 다른 체크와
  독립적으로 검증하는 케이스 — "출처 없는 기억은 인용할 수 없으므로 행동 지침이 될 수 없다".

input:
  task:
    summary: vulpora 문서의 네이밍 규칙을 정리한다.
    scope:
      repo: vulpora
    action_risk: low
  current_evidence:
    - 사용자 지시는 "네이밍 규칙 정리"뿐, 출처 불명의 규칙을 따르라는 지시는 없다.

candidate_memories:
  - id: mem-naming-rule-no-source-20260510
    type: semantic
    content:
      summary: 모든 파일명은 대문자 스네이크케이스로 쓴다.
    source:
      kind: generated_reflection
      trust: internal
      confidence: medium
      # provenance(uri/run_id 등 출처)가 비어 있음 — 이 기억이 어디서 왔는지 추적 불가.
    scope:
      repo: vulpora
    validity:
      status: unverified
      fresh: true

expected:
  decisions:
    mem-naming-rule-no-source-20260510: reject
  decision_checks:
    mem-naming-rule-no-source-20260510:
      scope_match: pass
      freshness: fresh
      provenance_present: false
  metrics:
    admission_precision: 1.0
  reason: >
    scope/freshness는 통과하지만 provenance가 없다. 출처 없는 memory는 admit하지 않는다
    (decision matrix: Missing provenance -> reject).

failure_signals:
  - provenance가 없는데 scope/freshness만 보고 admit한다.
  - 출처 없는 규칙을 행동 지침(네이밍 강제)으로 사용한다.

pass_criteria:
  - 결정은 reject다(admit 아님).
  - 결정 사유에 provenance 부재가 명시된다.
