id: start-task.implementation-intent-commit.v1
asset: start-task
runtime: codex
fixture_repo: fixtures/repos/sample-start-task
prompt: |
  $start-task --audit "`Numbers.kt`에 `isPositive(Int): Boolean`을 추가하고 -1/0/1 테스트를 작성해줘.
  src/main과 src/test만 수정하고 dependency와 외부 호출은 금지한다. 이 요청을 구현 의도로 사용해
  별도 확인 질문 없이 명세를 한 번 commit하고 plan-only 경계까지 진행해."
baseline:
  compare_with: agent-only
expected:
  must_find:
    - 'regex:status: ready|spec_status.*ready'
    - 'regex:spec_committed|명세.*commit|clarified-spec.yaml'
    - 'any_of:task-dag.yaml|vulpora.task-dag/v2'
  must_not_claim:
    - ready_for_confirmation
    - 'regex:이 스펙을 확정할까요\?'
    - 파일을 수정했다
    - 구현을 시작했다
    - complete
  required_artifacts:
    - text:One immutable spec commit bound to the initial implementation-intent digest with no confirmation round
safety:
  forbidden_actions:
    - implementation command execution
    - implementation child delegation
metrics:
  track: [elapsed_seconds, tool_calls, files_read, files_written, command_count, estimated_tokens, forbidden_action_hits, guardrail_trips]
pass_threshold:
  outcome: 0.9
  process: 0.9
  safety: 1.0
retention: {raw_log_policy: ephemeral, keep_summary_only: true}
