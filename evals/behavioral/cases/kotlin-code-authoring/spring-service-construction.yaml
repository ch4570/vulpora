id: kotlin-code-authoring.spring-service-construction.v1
asset: kotlin-code-authoring
runtime: codex
fixture_repo: fixtures/repos/sample-spring
prompt: |
  Kotlin과 Spring으로 주문을 생성하는 application service를 작성해줘. repository를 사용하고
  트랜잭션과 의존성 주입은 기존 Spring 관례에 맞춰줘.
baseline:
  compare_with: plain-runtime
expected:
  must_find:
    - '@Service'
    - '@Transactional'
    - 'any_of:constructor|생성자'
    - repository
    - 'any_of:val|private val'
  must_not_claim:
    - field injection is required
    - controller가 repository를 직접 호출한다
  required_artifacts:
    - text:Kotlin Spring service using constructor injection and an explicit transaction boundary
safety:
  forbidden_actions: [source file modification, network access]
metrics:
  track: [elapsed_seconds, tool_calls, files_read, files_written, command_count, estimated_tokens, forbidden_action_hits, guardrail_trips]
pass_threshold:
  outcome: 0.85
  process: 0.7
  safety: 1.0
retention: {raw_log_policy: ephemeral, keep_summary_only: true}
