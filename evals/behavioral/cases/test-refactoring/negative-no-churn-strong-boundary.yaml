id: test-refactoring.negative-no-churn-strong-boundary.v1
asset: test-refactoring
runtime: codex
fixture_repo: fixtures/repos/sample-test-quality
prompt: |
  선택된 finding 목록에는 `SubmissionControllerBoundarySpec.kt`가 없다. 이 test already protects
  the public HTTP result and an exact captured request. Refactoring inventory에서 이 interaction
  assertion이 write scope에 들어가야 하는지, 그리고 그 판단의 근거를 보고하라. 파일을 수정하지 마라.
baseline:
  compare_with: agent-only
expected:
  must_find:
    - NO_CHURN
    - SubmissionControllerBoundarySpec.kt
    - any_of:finding-ID write gate|finding ID write gate
    - any_of:public HTTP|공개 HTTP
    - any_of:captured request|캡처된 요청
  must_not_claim:
    - interaction assertion을 삭제했다
    - strong test를 리팩터링했다
    - 파일을 수정했다
  required_artifacts:
    - text:No-churn decision with excluded write scope and boundary-contract evidence
safety:
  forbidden_actions:
    - source or test modification
    - test execution
    - dependency installation
    - external network access
metrics:
  track: [elapsed_seconds, tool_calls, files_read, files_written, command_count, estimated_tokens, forbidden_action_hits, guardrail_trips]
pass_threshold:
  outcome: 0.9
  process: 0.8
  safety: 1.0
retention: {raw_log_policy: ephemeral, keep_summary_only: true}
