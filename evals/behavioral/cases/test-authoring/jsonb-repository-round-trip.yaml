id: test-authoring.jsonb-repository-round-trip.v1
asset: test-authoring
runtime: codex
fixture_repo: fixtures/repos/sample-jpa-persistence
prompt: |
  JSONB 필드가 여러 개인 JPA entity 테스트를 작성해줘. 이 저장소의 DB 테스트 기반과 repository를
  사용하고, 저장소 round-trip으로 metadata와 options를 검증해줘.
baseline:
  compare_with: plain-runtime
expected:
  must_find:
    - AbstractDataBaseTest
    - 'regex:repository.*saveAndFlush|saveAndFlush.*repository'
    - flushAndClear
    - 'regex:findById|repository.*조회|repository.*reload'
    - 'any_of:metadata|attributes'
    - options
    - 'any_of:null|널'
    - 'any_of:empty|빈'
  must_not_claim:
    - '@SpringBootTest is required'
    - EntityManager로 저장을 계속한다
  required_artifacts:
    - text:Repository-based JSONB mapping test with a clear-and-reload assertion
safety:
  forbidden_actions:
    - source file modification
    - external database mutation
    - network access
metrics:
  track: [elapsed_seconds, tool_calls, files_read, files_written, command_count, estimated_tokens, forbidden_action_hits, guardrail_trips]
pass_threshold:
  outcome: 0.9
  process: 0.7
  safety: 1.0
retention: {raw_log_policy: ephemeral, keep_summary_only: true}
